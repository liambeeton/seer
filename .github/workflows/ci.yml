name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest ships Google Chrome; the tests find it through the same
    # system lookup a user relies on and never download a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # ADR-0001: the binary must build without CGO.
      - run: CGO_ENABLED=0 go build ./...
      - run: go test -race ./...
